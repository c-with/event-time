services:
  event-time:
    build: .
    image: event-time:0.4.1
    container_name: event-time-v041
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file: .env
    environment:
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_NAME: activity_workbench
      DB_USER: activity_workbench_app
      ACTIVITY_HOST: 0.0.0.0
      ACTIVITY_PORT: "8097"
      ACTIVITY_DATA_DIR: /data
      APP_TIMEZONE: Asia/Shanghai
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
    ports:
      - "127.0.0.1:${HOST_PORT:-8601}:8097"
    volumes:
      - ./data:/data
    networks:
      - infra-db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

networks:
  infra-db:
    external: true
    name: infra-db
